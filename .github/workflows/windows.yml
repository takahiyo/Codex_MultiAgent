name: Windows regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test installer with the selected PowerShell engine
        shell: ${{ matrix.shell }}
        run: |
          & .\tests\smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Smoke tests failed.' }
